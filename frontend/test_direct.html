<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Directo - Vision Singularity</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test Directo - Vision Singularity API</h1>
    
    <div>
        <button onclick="testAPI()">🚀 Probar API</button>
        <button onclick="testCORS()">🌐 Probar CORS</button>
        <button onclick="clearResults()">🧹 Limpiar</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            console.log(message);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testAPI() {
            log('🔄 Iniciando pruebas de API...', 'info');
            
            try {
                // Test 1: Servidor básico
                log('🏠 Probando servidor básico...', 'info');
                const serverResponse = await fetch(`${API_BASE}/admin/`, { method: 'HEAD' });
                log(`✅ Servidor Django: ${serverResponse.status} ${serverResponse.statusText}`, 'success');
                
                // Test 2: API de eventos
                log('📡 Probando API de eventos...', 'info');
                const eventsResponse = await fetch(`${API_BASE}/events/`);
                log(`📊 Status: ${eventsResponse.status} ${eventsResponse.statusText}`, eventsResponse.ok ? 'success' : 'error');
                
                // Test 3: Headers
                log('🔧 Headers de respuesta:', 'info');
                const headers = {};
                for (let [key, value] of eventsResponse.headers.entries()) {
                    headers[key] = value;
                }
                log(`<pre>${JSON.stringify(headers, null, 2)}</pre>`, 'info');
                
                // Test 4: Datos
                if (eventsResponse.ok) {
                    const data = await eventsResponse.json();
                    log(`✅ Datos recibidos: ${data.length} elementos`, 'success');
                    log(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    const errorText = await eventsResponse.text();
                    log(`❌ Error: ${errorText}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error de conexión: ${error.message}`, 'error');
                log(`💡 Asegúrate de que el servidor esté ejecutándose en ${API_BASE}`, 'info');
            }
        }
        
        async function testCORS() {
            log('🌐 Probando configuración CORS...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/events/`, {
                    method: 'OPTIONS'
                });
                
                log(`🔧 CORS Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const corsHeaders = {
                    'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
                    'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
                    'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers'),
                };
                
                log(`🔧 CORS Headers: <pre>${JSON.stringify(corsHeaders, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                log(`❌ Error CORS: ${error.message}`, 'error');
            }
        }
        
        // Test automático al cargar
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Página cargada, ejecutando test automático...', 'info');
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
